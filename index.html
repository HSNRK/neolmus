<head>
<meta charset="UTF-8"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0a0a;color:#e8e4dc;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:none;outline:none;background:none}
a{text-decoration:none;color:inherit}
#hdr{display:flex;align-items:center;gap:11px;padding:10px 14px;background:#0a0a0a;position:sticky;top:0;z-index:200;border-bottom:2px solid #b8860b}
.logo{width:46px;height:46px;object-fit:contain;flex-shrink:0;border-radius:10px;background:#1a1500;display:flex;align-items:center;justify-content:center;font-size:26px}
.hdr-mid{flex:1;min-width:0}
.app-title{font-size:24px;font-weight:900;color:#f0c040;line-height:1;letter-spacing:-.5px}
.clk{font-size:11px;color:#888;margin-top:2px}
.hdr-r{display:flex;gap:7px;flex-shrink:0}
.pill{display:flex;align-items:center;gap:5px;background:#1c1c1e;color:#ccc;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;border:none}

.nc-meta{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}

.btn-detail{background:#1a1a1a;color:#888;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;border:none;cursor:pointer}

.hi-tx{font-size:13px;line-height:1.75;color:#b0aca4}
.hi-note{font-size:10px;color:#2a2a2a;margin-top:8px;font-style:italic}
.ev{margin-bottom:8px;border-radius:10px;overflow:hidden;border:1px solid #1c1c1c;background:#0f0f0f}
.ev.hot{border-color:rgba(240,192,64,.35);background:#100e00}
.ev-head{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.ev-em{font-size:22px;min-width:30px}
.ev-info{flex:1;min-width:0}
.ev-name{font-size:13px;font-weight:700;display:block;margin-bottom:2px;color:#e8e4dc}
.ev-date{color:#3a3a3a;font-size:10px;display:block;margin-bottom:2px}

.ev-detail{display:none;padding:0 12px 14px 54px;border-top:1px solid #181818}
.ev-detail.open{display:block}
.ev-text{font-size:12px;line-height:1.9;color:#999;margin-top:10px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:9999;background:#111;color:#f0c040;border:1px solid #b8860b;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 4px 24px rgba(0,0,0,.8);display:none;max-width:90vw;text-align:center}
#toast.on{display:block;animation:tup .3s ease}
@keyframes tup{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#sbar{font-size:10px;color:#2a2a2a;padding:3px 14px;min-height:16px}
.empty{color:#444;font-size:13px;padding:24px 0;text-align:center;line-height:2}
.stale-note{font-size:10px;color:#3a3020;font-style:italic;padding:4px 0}
</style>

    <p class="note" id="note-al" style="display:none">🌐 Yabancı kaynak başlıkları Türkçe'ye çevrilmiştir</p>

  </div>

<script>
/* ═══════════════════════════════════
   Ne Olmuş — haber motoru (DÜZELTİLMİŞ)
   - runLimited fonksiyonu eklendi
   - Çoklu proxy fallback (rss2json + allorigins + corsproxy)
   - XML fallback eklendi
═══════════════════════════════════ */

var TR_FEEDS = [
  {n:"Hürriyet",  u:"https://www.hurriyet.com.tr/rss/anasayfa"},
  {n:"NTV",       u:"https://www.ntv.com.tr/son-dakika.rss"},
  {n:"Sözcü",     u:"https://www.sozcu.com.tr/rss.xml"},
  {n:"Habertürk", u:"https://www.haberturk.com/rss"}
];

var WO_FEEDS = [
  {n:"BBC World",         u:"https://feeds.bbci.co.uk/news/world/rss.xml"},
  {n:"NY Times",          u:"https://rss.nytimes.com/services/xml/rss/nyt/World.xml"},
  {n:"Sky News",          u:"https://feeds.skynews.com/feeds/rss/world.xml"},
  {n:"Al Jazeera",        u:"https://www.aljazeera.com/xml/rss/all.xml"},
  {n:"CNN International", u:"https://rss.cnn.com/rss/edition_world.rss"}
];

var BREAK_KW = [
  "öldü","vefat","hayatını kaybetti","deprem","patlama","saldırı","darbe","acil","kaza",
  "died","dead","killed","earthquake","breaking","blast","crash","urgent","explosion"
];

/* ── iOS uyumlu fetch ── */
function xfetch(url, ms) {
  var ctrl = new AbortController();
  var tid = setTimeout(function(){ ctrl.abort(); }, ms || 12000);
  return fetch(url, {signal: ctrl.signal, cache:"no-store"})
    .then(function(r){ clearTimeout(tid); return r; })
    .catch(function(e){ clearTimeout(tid); throw e; });
}

/* ── Önbellek ── */
function cGet(k, ms) {
  try {
    var r = JSON.parse(localStorage.getItem("no_" + k));
    if (r && (Date.now() - r.t) < (ms || 3600000)) return r.v;
  } catch(e) {}
  return null;
}
function cGetOld(k) {
  try { return JSON.parse(localStorage.getItem("no_" + k)) || null; } catch(e) { return null; }
}
function cSet(k, v) {
  try { localStorage.setItem("no_" + k, JSON.stringify({v: v, t: Date.now()})); } catch(e) {}
}
function cDel(k) { try { localStorage.removeItem("no_" + k); } catch(e) {} }

/* ── Yardımcılar ── */
function ge(id) { return document.getElementById(id); }
function esc(s) { var d=document.createElement("div"); d.textContent=String(s||""); return d.innerHTML; }
function stripHtml(h) {
  if (!h) return "";
  var d = document.createElement("div"); d.innerHTML = h;
  return (d.textContent || "").replace(/\s+/g," ").trim();
}
function timeAgo(iso) {
  try {
    var dt = new Date(iso); if(isNaN(dt)) return "";
    var m = Math.floor((Date.now()-dt)/60000);
    if(m<1)return"az önce"; if(m<60)return m+" dk önce";
    if(m<1440)return Math.floor(m/60)+" sa önce";
    return dt.toLocaleDateString("tr-TR",{day:"numeric",month:"short"});
  } catch(e){ return ""; }
}
function fmtDM(d)  { return d.toLocaleDateString("tr-TR",{day:"numeric",month:"long"}); }
function fmtDMY(d) { return d.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}); }
function setSp(id, on) { var el=ge("sp-"+id); if(el){ if(on)el.classList.add("on"); else el.classList.remove("on"); } }
function setStatus(m) { var el=ge("sbar"); if(el) el.textContent = m||""; }
function isBreaking(t) {
  if(!t) return false;
  var tl=(t||"").toLowerCase();
  for(var i=0;i<BREAK_KW.length;i++) if(tl.indexOf(BREAK_KW[i])>=0) return true;
  return false;
}

/* ═══════════════════════════════════
   runLimited: EKSİK OLAN FONKSİYON
   Paralel görevleri limitli çalıştırır.
═══════════════════════════════════ */
function runLimited(tasks, limit) {
  return new Promise(function(resolve){
    var results = new Array(tasks.length);
    var nextIdx = 0;
    var running = 0;
    var completed = 0;
    var total = tasks.length;

    if (total === 0) { resolve(results); return; }

    function launch() {
      while (running < limit && nextIdx < total) {
        (function(idx){
          running++;
          nextIdx++;
          Promise.resolve()
            .then(tasks[idx])
            .then(function(r){ results[idx] = r || []; })
            .catch(function(){ results[idx] = []; })
            .then(function(){
              running--;
              completed++;
              if (completed === total) resolve(results);
              else launch();
            });
        })(nextIdx);
      }
    }
    launch();
  });
}

/* ── XML ayrıştır ── */
function parseXML(txt, sourceName) {
  try {
    if(!txt || txt.length < 100) return [];
    var doc = new DOMParser().parseFromString(txt, "text/xml");
    if(doc.querySelector("parsererror"))
      doc = new DOMParser().parseFromString(txt, "text/html");
    var items = Array.prototype.slice.call(doc.querySelectorAll("item,entry"));
    var out = [];
    for(var i=0; i<Math.min(items.length,5); i++) {
      var item = items[i];
      var te = item.querySelector("title");
      var title = stripHtml(te ? te.textContent : "");
      if(!title || title.length < 4) continue;
      var url = "";
      var le = item.querySelector("link");
      if(le) url = le.getAttribute("href") || stripHtml(le.textContent) || "";
      if(!url || url.indexOf("http") !== 0) {
        var g2 = item.querySelector("guid");
        if(g2) { var gv=stripHtml(g2.textContent); if(gv.indexOf("http")===0) url=gv; }
      }
      var de = item.querySelector("description")||item.querySelector("summary")||item.querySelector("content");
      var summ = de ? stripHtml(de.textContent).slice(0,250) : "";
      var dte = item.querySelector("pubDate")||item.querySelector("published")||item.querySelector("updated");
      var pub = dte ? (function(){var x=new Date(stripHtml(dte.textContent)); return isNaN(x)?new Date().toISOString():x.toISOString();})() : new Date().toISOString();
      out.push({title:title, summary:summ, url:url, source:sourceName, pub:pub});
    }
    return out;
  } catch(e) { return []; }
}

/* ═══════════════════════════════════
   ÇOK KATMANLI HABER ÇEKME
   Sırayla dener: rss2json → allorigins(xml) → corsproxy(xml)
═══════════════════════════════════ */
function fetchViaRss2Json(feedUrl, sourceName) {
  var url = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(feedUrl) + "&count=5";
  return xfetch(url, 10000)
    .then(function(r){ if(!r.ok) throw new Error("http"+r.status); return r.json(); })
    .then(function(d){
      if(d && d.status==="ok" && d.items && d.items.length){
        return d.items.slice(0,5).map(function(item){
          return {
            title:   stripHtml(item.title||""),
            summary: stripHtml(item.description||item.content||"").slice(0,250),
            url:     item.link||"",
            source:  sourceName,
            pub:     item.pubDate||new Date().toISOString()
          };
        }).filter(function(i){ return i.title && i.title.length>3; });
      }
      return [];
    });
}

function fetchViaAllOrigins(feedUrl, sourceName) {
  var url = "https://api.allorigins.win/raw?url=" + encodeURIComponent(feedUrl);
  return xfetch(url, 12000)
    .then(function(r){ if(!r.ok) throw new Error("http"+r.status); return r.text(); })
    .then(function(txt){ return parseXML(txt, sourceName); });
}

function fetchViaCorsProxy(feedUrl, sourceName) {
  var url = "https://corsproxy.io/?" + encodeURIComponent(feedUrl);
  return xfetch(url, 12000)
    .then(function(r){ if(!r.ok) throw new Error("http"+r.status); return r.text(); })
    .then(function(txt){ return parseXML(txt, sourceName); });
}

function fetchOneFeed(feedUrl, sourceName) {
  window.NEO_DEBUG = window.NEO_DEBUG || [];
  var dbg = function(m){ window.NEO_DEBUG.push(sourceName + ": " + m); };

  return fetchViaRss2Json(feedUrl, sourceName)
    .then(function(items){
      if(items && items.length){ dbg("rss2json OK ("+items.length+")"); return items; }
      dbg("rss2json boş");
      return fetchViaAllOrigins(feedUrl, sourceName);
    })
    .then(function(items){
      if(items && items.length){ dbg("allorigins OK ("+items.length+")"); return items; }
      dbg("allorigins boş");
      return fetchViaCorsProxy(feedUrl, sourceName);
    })
    .then(function(items){
      if(items && items.length){ dbg("corsproxy OK ("+items.length+")"); return items; }
      dbg("tüm yöntemler başarısız");
      return [];
    })
    .catch(function(err){
      dbg("HATA: " + (err.message||err));
      return [];
    });
}

/* ── TÜM TR HABERLERİ ── */
function loadTR() {
  return new Promise(function(resolve){
    var cached = cGet("tr");
    if(cached && cached.length) { resolve({data:cached, stale:false}); return; }
    setSp("tr",true); setSp("al",true);
    runLimited(TR_FEEDS.map(function(s){ return function(){ return fetchOneFeed(s.u, s.n); }; }), 2)
      .then(function(results){
        var all = [];
        results.forEach(function(r){ all = all.concat(r||[]); });
        all.sort(function(a,b){ return new Date(b.pub)-new Date(a.pub); });
        all = all.slice(0,12);
        setSp("tr",false);
        if(all.length) { cSet("tr",all); resolve({data:all,stale:false}); }
        else { var o=cGetOld("tr"); resolve({data:o?o.v:[],stale:true,at:o?o.t:0}); }
      });
  });
}

/* ── TÜM DÜNYA HABERLERİ ── */
function loadWO() {
  return new Promise(function(resolve){
    var cached = cGet("wo");
    if(cached && cached.length) { resolve({data:cached, stale:false}); return; }
    setSp("wo",true);
    runLimited(WO_FEEDS.map(function(s){ return function(){ return fetchOneFeed(s.u, s.n); }; }), 2)
      .then(function(results){
        var all = [];
        results.forEach(function(r){ all = all.concat(r||[]); });
        all.sort(function(a,b){ return new Date(b.pub)-new Date(a.pub); });
        all = all.slice(0,12);
        setSp("wo",false);
        if(!all.length) { var o=cGetOld("wo"); resolve({data:o?o.v:[],stale:true,at:o?o.t:0}); return; }
        resolve({data:all,stale:false});
        cSet("wo",all);
        translateItems(all, function(translated){
          cSet("wo",translated);
          var pwo=ge("p-wo");
          if(pwo && pwo.style.display!=="none") renderNews(translated,"list-wo","cnt-wo","stale-wo");
          var trData=cGet("tr");
          if(trData){
            var combined=(trData||[]).concat(translated||[])
              .sort(function(a,b){return new Date(b.pub)-new Date(a.pub);}).slice(0,15);
            renderNews(combined,"list-al","cnt-al",null);
          }
        });
      });
  });
}

/* ── ÇEVİRİ ── */
function translateItems(items, callback) {
  var translated = [];
  var pending = items.length;
  if(!pending) { callback([]); return; }
  items.forEach(function(item, idx){
    translateOne(item.title, function(t){
      translated[idx] = Object.assign({}, item, {title:t, origTitle:item.title});
      pending--;
      if(pending === 0) callback(translated);
    });
  });
}
function translateOne(text, cb) {
  if(!text || text.length < 3) { cb(text); return; }
  var t = text.slice(0,400);
  var ck = "tx_"+t.slice(0,16).replace(/[^a-z0-9]/gi,"");
  var hit = cGet(ck, 86400000);
  if(hit) { cb(hit); return; }
  xfetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(t)+"&langpair=en|tr", 8000)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.responseStatus===200 && d.responseData && d.responseData.translatedText){
        cSet(ck, d.responseData.translatedText);
        cb(d.responseData.translatedText);
      } else cb(text);
    })
    .catch(function(){ cb(text); });
}

/* ── TARİHTE BUGÜN ── */
function loadHistory() {
  return new Promise(function(resolve){
    var td=new Date(), m=td.getMonth()+1, d=td.getDate();
    var ck="hist_"+m+"_"+d;
    var cached=cGet(ck,43200000);
    if(cached){resolve(cached);return;}
    xfetch("https://tr.wikipedia.org/api/rest_v1/feed/onthisday/events/"+m+"/"+d,20000)
      .then(function(r){return r.json();})
      .then(function(data){
        if(!data.events||!data.events.length)throw 0;
        var evts=data.events
