<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0a0a;color:#e8e4dc;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:none;outline:none;background:none}
a{text-decoration:none;color:inherit}
#hdr{display:flex;align-items:center;gap:11px;padding:10px 14px;background:#0a0a0a;position:sticky;top:0;z-index:200;border-bottom:2px solid #b8860b}
.logo{width:46px;height:46px;object-fit:cover;flex-shrink:0;border-radius:10px;background:#1a1500;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}

#upd-t{color:#555;margin-left:auto}
.acc{border-bottom:1px solid #1a1a1a}

.acc-ico{font-size:18px;flex-shrink:0}

.ev-head{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;user-select:none}

#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:9999;background:#111;color:#f0c040;border:1px solid #b8860b;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 4px 24px rgba(0,0,0,.8);display:none;max-width:90vw;text-align:center}
#toast.on{display:block;animation:tup .3s ease}
@keyframes tup{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#sbar{font-size:10px;color:#2a2a2a;padding:3px 14px;min-height:16px}
.empty{color:#444;font-size:13px;padding:24px 0;text-align:center;line-height:2}
.debug-box{text-align:left;background:#111;border:1px solid #333;border-radius:8px;padding:10px;margin-top:12px;font-size:10px;color:#888;font-family:monospace;white-space:pre-wrap;word-break:break-word;max-height:250px;overflow-y:auto}
</style>

<script>
/* ═══════════════════════════════════
   Ne Olmuş — Hızlı sürüm (timeout kısaltıldı)
═══════════════════════════════════ */

var TR_FEEDS = [
  {n:"CNN Türk",    u:"https://www.cnnturk.com/feed/rss/all/news"},
  {n:"DW Türkçe",   u:"https://rss.dw.com/rdf/rss-tur-all"},
  {n:"Sözcü",       u:"https://www.sozcu.com.tr/rss.xml"},
  {n:"Cumhuriyet",  u:"https://www.cumhuriyet.com.tr/rss"},
  {n:"Sabah",       u:"https://www.sabah.com.tr/rss/anasayfa.xml"}
];

var WO_FEEDS = [
  {n:"NY Times",    u:"https://rss.nytimes.com/services/xml/rss/nyt/World.xml"},
  {n:"DW English",  u:"https://rss.dw.com/rdf/rss-en-world"},
  {n:"BBC World",   u:"https://feeds.bbci.co.uk/news/world/rss.xml", proxy:true},
  {n:"Al Jazeera",  u:"https://www.aljazeera.com/xml/rss/all.xml", proxy:true},
  {n:"The Guardian",u:"https://www.theguardian.com/world/rss", proxy:true},
  {n:"Sky News",    u:"https://feeds.skynews.com/feeds/rss/world.xml", proxy:true},
  {n:"France24",    u:"https://www.france24.com/en/rss", proxy:true},
  {n:"NPR World",   u:"https://feeds.npr.org/1004/rss.xml", proxy:true}
];

var WO_TR_FEEDS = [
  {n:"BBC Türkçe",   u:"https://feeds.bbci.co.uk/turkce/rss.xml"},
  {n:"Euronews TR",  u:"https://tr.euronews.com/rss"}
];

var BREAK_KW = [
  "öldü","vefat","hayatını kaybetti","deprem","patlama","saldırı","darbe","acil","kaza",
  "died","dead","killed","earthquake","breaking","blast","crash","urgent","explosion"
];

window.NEO_DEBUG = [];

var PROXIES = [
  function(u){ return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); },
  function(u){ return "https://corsproxy.io/?" + encodeURIComponent(u); },
  function(u){ return "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u); }
];

function xfetch(url, ms) {
  var ctrl = new AbortController();
  var tid = setTimeout(function(){ ctrl.abort(); }, ms || 5000);
  return fetch(url, {signal: ctrl.signal, cache:"no-store", mode:"cors"})
    .then(function(r){ clearTimeout(tid); return r; })
    .catch(function(e){ clearTimeout(tid); throw e; });
}

function cGet(k, ms) {
  try {
    var r = JSON.parse(localStorage.getItem("no_" + k));
    if (r && (Date.now() - r.t) < (ms || 3600000)) return r.v;
  } catch(e) {}
  return null;
}
function cGetOld(k) {
  try { return JSON.parse(localStorage.getItem("no_" + k)) || null; } catch(e) { return null; }
}
function cSet(k, v) {
  try { localStorage.setItem("no_" + k, JSON.stringify({v: v, t: Date.now()})); } catch(e) {}
}
function cDel(k) { try { localStorage.removeItem("no_" + k); } catch(e) {} }

function ge(id) { return document.getElementById(id); }
function esc(s) { var d=document.createElement("div"); d.textContent=String(s||""); return d.innerHTML; }
function stripHtml(h) {
  if (!h) return "";
  var d = document.createElement("div"); d.innerHTML = h;
  return (d.textContent || "").replace(/\s+/g," ").trim();
}
function timeAgo(iso) {
  try {
    var dt = new Date(iso); if(isNaN(dt)) return "";
    var m = Math.floor((Date.now()-dt)/60000);
    if(m<1)return"az önce"; if(m<60)return m+" dk önce";
    if(m<1440)return Math.floor(m/60)+" sa önce";
    return dt.toLocaleDateString("tr-TR",{day:"numeric",month:"short"});
  } catch(e){ return ""; }
}
function fmtDM(d)  { return d.toLocaleDateString("tr-TR",{day:"numeric",month:"long"}); }
function fmtDMY(d) { return d.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}); }
function setSp(id, on) { var el=ge("sp-"+id); if(el){ if(on)el.classList.add("on"); else el.classList.remove("on"); } }
function setStatus(m) { var el=ge("sbar"); if(el) el.textContent = m||""; }
function dbg(msg) { window.NEO_DEBUG.push(msg); }
function isBreaking(t) {
  if(!t) return false;
  var tl=(t||"").toLowerCase();
  for(var i=0;i<BREAK_KW.length;i++) if(tl.indexOf(BREAK_KW[i])>=0) return true;
  return false;
}

function runLimited(tasks, limit) {
  return new Promise(function(resolve){
    var results = new Array(tasks.length);
    var nextIdx = 0, running = 0, completed = 0, total = tasks.length;
    if (total === 0) { resolve(results); return; }
    function launch() {
      while (running < limit && nextIdx < total) {
        (function(idx){
          running++; nextIdx++;
          Promise.resolve().then(tasks[idx])
            .then(function(r){ results[idx] = r || []; })
            .catch(function(){ results[idx] = []; })
            .then(function(){ running--; completed++; if (completed === total) resolve(results); else launch(); });
        })(nextIdx);
      }
    }
    launch();
  });
}

function parseXML(txt, sourceName) {
  try {
    if(!txt || txt.length < 100) return [];
    var doc = new DOMParser().parseFromString(txt, "text/xml");
    if(doc.querySelector("parsererror")) doc = new DOMParser().parseFromString(txt, "text/html");
    var items = Array.prototype.slice.call(doc.querySelectorAll("item,entry"));
    var out = [];
    for(var i=0; i<Math.min(items.length,6); i++) {
      var item = items[i];
      var te = item.querySelector("title");
      var title = stripHtml(te ? te.textContent : "");
      if(!title || title.length < 4) continue;
      var url = "";
      var le = item.querySelector("link");
      if(le) url = le.getAttribute("href") || stripHtml(le.textContent) || "";
      if(!url || url.indexOf("http") !== 0) {
        var g2 = item.querySelector("guid");
        if(g2) { var gv=stripHtml(g2.textContent); if(gv.indexOf("http")===0) url=gv; }
      }
      var de = item.querySelector("description")||item.querySelector("summary")||item.querySelector("content");
      var summ = de ? stripHtml(de.textContent).slice(0,300) : "";
      var dte = item.querySelector("pubDate")||item.querySelector("published")||item.querySelector("updated");
      var pub = new Date().toISOString();
      if(dte){ var pd=new Date(stripHtml(dte.textContent)); if(!isNaN(pd)) pub=pd.toISOString(); }
      out.push({title:title, summary:summ, url:url, source:sourceName, pub:pub});
    }
    return out;
  } catch(e) { dbg(sourceName+": parse hatası: "+e.message); return []; }
}

function fetchOneFeed(feedUrl, sourceName, useProxy) {
  var t0 = Date.now();

  function tryDirect(){
    return xfetch(feedUrl, 4000)
      .then(function(r){
        if(!r.ok) throw new Error("HTTP"+r.status);
        return r.text();
      })
      .then(function(txt){
        var items = parseXML(txt, sourceName);
        if(items.length){ dbg(sourceName+": ✓ direkt "+items.length+" ("+(Date.now()-t0)+"ms)"); return items; }
        throw new Error("boş");
      });
  }

  function tryProxies(){
    var idx = 0;
    function next(){
      if(idx >= PROXIES.length) return Promise.reject(new Error("proxy yok"));
      var proxyUrl = PROXIES[idx](feedUrl);
      var pIdx = idx;
      idx++;
      return xfetch(proxyUrl, 6000)
        .then(function(r){
          if(!r.ok) throw new Error("HTTP"+r.status);
          return r.text();
        })
        .then(function(txt){
          var items = parseXML(txt, sourceName);
          if(items.length){
            dbg(sourceName+": ✓ proxy"+(pIdx+1)+" "+items.length+" ("+(Date.now()-t0)+"ms)");
            return items;
          }
          throw new Error("boş");
        })
        .catch(function(){ return next(); });
    }
    return next();
  }

  if(useProxy){
    return tryDirect().catch(function(){ return tryProxies(); })
      .catch(function(err){ dbg(sourceName+": ✗ "+(err.message||err)+" ("+(Date.now()-t0)+"ms)"); return []; });
  } else {
    return tryDirect()
      .catch(function(err){ dbg(sourceName+": ✗ "+(err.message||err)+" ("+(Date.now()-t0)+"ms)"); return []; });
  }
}

function loadTR() {
  return new Promise(function(resolve){
    var cached = cGet("tr");
    if(cached && cached.length) { resolve({data:cached, stale:false}); return; }
    setSp("tr",true); setSp("al",true);
    dbg("=== TR yükleme ("+TR_FEEDS.length+" kaynak) ===");
    runLimited(TR_FEEDS.map(function(s){ return function(){ return fetchOneFeed(s.u, s.n, false); }; }), 5)
      .then(function(results){
        var all = [];
        results.forEach(function(r){ all = all.concat(r||[]); });
        all.sort(function(a,b){ return new Date(b.pub)-new Date(a.pub); });
        all = all.slice(0,30);
        setSp("tr",false);
        dbg("=== TR toplam: "+all.length+" haber ===");
        if(all.length) { cSet("tr",all); resolve({data:all,stale:false}); }
        else { var o=cGetOld("tr"); resolve({data:o?o.v:[],stale:true,at:o?o.t:0}); }
      });
  });
}

function loadWO() {
  return new Promise(function(resolve){
    var cached = cGet("wo");
    if(cached && cached.length) { resolve({data:cached, stale:false}); return; }
    setSp("wo",true);
    dbg("=== Dünya yükleme ===");

    var allTasks = [];
    WO_FEEDS.forEach(function(s){ allTasks.push({src:s, isTR:false}); });
    WO_TR_FEEDS.forEach(function(s){ allTasks.push({src:s, isTR:true}); });

    var tasks = allTasks.map(function(t){
      return function(){
        return fetchOneFeed(t.src.u, t.src.n, t.src.proxy).then(function(items){
          if(t.isTR){
            return items.map(function(it){ return Object.assign({}, it, {alreadyTR:true}); });
          }
          return items;
        });
      };
    });

    runLimited(tasks, 5)
      .then(function(results){
        var all = [];
        results.forEach(function(r){ all = all.concat(r||[]); });
        all.sort(function(a,b){ return new Date(b.pub)-new Date(a.pub); });
        all = all.slice(0,30);
        setSp("wo",false);
        dbg("=== Dünya toplam: "+all.length+" ===");
        if(!all.length) { var o=cGetOld("wo"); resolve({data:o?o.v:[],stale:true,at:o?o.t:0}); return; }

        resolve({data:all,stale:false});

        var noteEl = ge("note-wo");
        if(noteEl){ noteEl.textContent = "🌐 İngilizce haberler Türkçe'ye çevriliyor..."; noteEl.classList.add("tr-active"); }

        var needsTranslation = all.filter(function(it){ return !it.alreadyTR; });
        var alreadyTR = all.filter(function(it){ return it.alreadyTR; });

        dbg("Çeviri: "+needsTranslation.length+" çevrilecek, "+alreadyTR.length+" zaten TR");

        if(!needsTranslation.length){
          renderNews(all, "list-wo", "cnt-wo", "stale-wo");
          if(noteEl){ noteEl.textContent = "🌐 Tüm haberler Türkçe"; noteEl.classList.remove("tr-active"); }
          finishWO(all);
          return;
        }

        translateAll(needsTranslation, function(translated){
          var combined = alreadyTR.concat(translated)
            .sort(function(a,b){ return new Date(b.pub)-new Date(a.pub); });
          cSet("wo", combined);
          renderNews(combined, "list-wo", "cnt-wo", "stale-wo");
          if(noteEl){ noteEl.textContent = "🌐 Tüm başlıklar ve özetler Türkçe"; noteEl.classList.remove("tr-active"); }
          finishWO(combined);
        });
      });
  });
}

function finishWO(combined){

function translateAll(items, callback) {
  var out = [];
  var pending = items.length;
  if(!pending){ callback([]); return; }
  items.forEach(function(item, idx){
    var titleDone = false, summDone = false;
    var newItem = Object.assign({}, item);

    function checkDone(){
      if(titleDone && summDone){
        pending--;
        if(pending === 0) callback(out);
      }
    }

    translateOne(item.title, "en", "tr", function(t){
      newItem.title = t || item.title;
      newItem.origTitle = item.title;
      titleDone = true;
      checkDone();
    });

    if(item.summary && item.summary.length > 10){
      translateOne(item.summary, "en", "tr", function(s){
        newItem.summary = s || item.summary;
        newItem.origSummary = item.summary;
        summDone = true;
        checkDone();
      });
    } else {
      summDone = true;
    }

    out[idx] = newItem;
  });
}

function translateOne(text, from, to, cb) {
  if(!text || text.length < 3){ cb(text); return; }
  var t = text.slice(0, 1500);
  var ck = "gtx_" + from + "_" + to + "_" + t.slice(0,24).replace(/[^a-z0-9]/gi,"");
  var hit = cGet(ck, 2592000000);
  if(hit){ cb(hit); return; }

  var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl="
    + from + "&tl=" + to + "&dt=t&q=" + encodeURIComponent(t);

  xfetch(url, 9000)
    .then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(d){
      var result = "";
      if(Array.isArray(d) && Array.isArray(d[0])){
        d[0].forEach(function(part){
          if(part && part[0]) result += part[0];
        });
      }
      if(result && result.length > 0){
        cSet(ck, result);
        cb(result);
      } else {
        cb(text);
      }
    })
    .catch(function(err){
      dbg("Çeviri hatası: " + (err.message||err));
      cb(text);
    });
}

function loadHistory() {
  return new Promise(function(resolve){
    var td=new Date(), m=td.getMonth()+1, d=td.getDate();
    var ck="hist_tr_"+m+"_"+d;
    var cached=cGet(ck,43200000);
    if(cached){resolve(cached);return;}
    dbg("Tarihte Bugün: yükleniyor...");
    xfetch("https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/"+m+"/"+d,15000)
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(data){
        if(!data.events||!data.events.length){ dbg("Tarihte Bugün: boş"); resolve([]); return; }
        var evts=data.events
          .map(function(e){return{year:parseInt(e.year)||0,event:e.text};})
          .filter(function(e){return e.year>0&&e.event;})
          .sort(function(a,b){return b.year-a.year;})
          .slice(0,20);
        dbg("Tarihte Bugün: "+evts.length+" olay, çeviri başlıyor...");
        translateHistory(evts, function(translated){
          dbg("Tarihte Bugün: ✓ "+translated.length+" olay çevrildi");
          cSet(ck, translated);
          resolve(translated);
        });
      }).catch(function(err){
        dbg("Tarihte Bugün: ✗ "+(err.message||err));
        resolve([]);
      });
  });
}

function translateHistory(events, callback) {
  var out = new Array(events.length);
  var pending = events.length;
  if(!pending){ callback([]); return; }
  events.forEach(function(ev, idx){
    translateOne(ev.event, "en", "tr", function(t){
      out[idx] = {year: ev.year, event: t || ev.event};
      pending--;
      if(pending === 0) callback(out);
    });
  });
}

function getActiveEvents(){
  var today=new Date(),year=today.getFullYear();
  var tn=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  var results=[];
  FOLK.forEach(function(ev){
    var start,end;
    if(ev.tp==="s"){
      var yr=year,t0=new Date(yr,ev.m-1,ev.d);
      if(t0<new Date(+tn-20*864e5))yr++;
      start=end=new Date(yr,ev.m-1,ev.d);
    }else{
      var sy=year,ey=year;
      if(ev.sM>ev.eM){if(today.getMonth()+1<=ev.eM)sy=year-1;else ey=year+1;}
      start=new Date(sy,ev.sM-1,ev.sD);end=new Date(ey,ev.eM-1,ev.eD);
    }
    var ds=Math.floor((start-tn)/864e5),de=Math.floor((end-tn)/864e5);
    if(ds<=20&&de>=-20){
      var st;
      if(ev.tp==="p"){if(ds<=0&&de>=0)st="act";else if(de<0)st="past";else st="soon";}
      else{if(ds===0)st="act";else if(ds<0)st="past";else st="soon";}
      results.push({ev:ev,start:start,end:end,ds:ds,de:de,st:st});
    }
  });
  results.sort(function(a,b){return a.ds-b.ds;});
  return results;
}

function makeSkel(n){
  var h="";n=n||4;
  for(var i=0;i<n;i++){
    h+='<div style="padding:14px 0;border-bottom:1px solid #1a1a1a">';
    h+='<div class="sk" style="height:10px;width:'+(20+i*10)+'%"></div>';
    h+='<div class="sk" style="height:16px;width:95%"></div>';
    h+='<div class="sk" style="height:11px;width:'+(50+i*7)+'%"></div>';
    h+='<div class="sk" style="height:10px;width:25%"></div></div>';
  }
  return h;
}

function renderNews(items, listId, cntId, staleId){
  var el=ge(listId), cnt=cntId?ge(cntId):null, stEl=staleId?ge(staleId):null;
  if(stEl) stEl.innerHTML="";
  if(!items||!items.length){
    var dbgHtml = "";
    if(window.NEO_DEBUG && window.NEO_DEBUG.length){
      dbgHtml = '<div class="debug-box">'+esc(window.NEO_DEBUG.slice(-25).join("\n"))+'</div>';
    }
    el.innerHTML='<div class="empty">Haber yüklenemedi. 🔄 Yenile butonuna basın.' + dbgHtml + '</div>';
    if(cnt)cnt.style.display="none";return;
  }
  if(cnt){cnt.textContent=items.length+" haber";cnt.style.display="inline";}
  var h="";
  for(var i=0;i<items.length;i++){
    var it=items[i],brk=isBreaking(it.title)||isBreaking(it.origTitle||"");
    h+='<div class="nc'+(brk?' brk':'')+'">';
    if(brk)h+='<div class="brk-lbl">🔴 SON DAKİKA</div>';
    h+='<div class="nc-meta"><span class="nc-src">'+esc(it.source)+'</span><span class="nc-dt">'+timeAgo(it.pub)+'</span></div>';
    h+='<div class="nc-title">'+esc(it.title)+'</div>';
    if(it.origTitle && it.origTitle !== it.title){
      h+='<div class="nc-orig">🇬🇧 '+esc(it.origTitle)+'</div>';
    }
    h+='<div class="nc-body">'+esc(it.summary||"Haberin tamamı için kaynağa gidin.")+'</div>';
    h+='<div class="nc-footer"><button class="btn-detail">Özet</button>';
    if(it.url&&it.url.indexOf("http")===0)
      h+='<a class="nc-link" href="'+esc(it.url)+'" target="_blank" rel="noopener">🔗 Habere Git</a>';
    h+='</div></div>';
  }
  el.innerHTML=h;
  el.onclick=function(ev){
    var nc=(ev.target.closest(".nc-title")||ev.target.closest(".btn-detail"));
    if(!nc)return;
    nc=nc.closest(".nc");
    if(!nc)return;
    var body=nc.querySelector(".nc-body"),btn=nc.querySelector(".btn-detail");
    var o=body.classList.toggle("open");
    if(btn)btn.textContent=o?"Gizle":"Özet";
  };
}

function renderHistory(evts){
  var el=ge("hist-content");
  if(!evts||!evts.length){ el.innerHTML='<p class="empty">Tarihsel veri yüklenemedi.</p>'; return; }
  var h="";
  for(var i=0;i<evts.length;i++)
    h+='<div class="hi"><span class="hi-yr">'+evts[i].year+'</span><p class="hi-tx">'+esc(evts[i].event)+'</p></div>';
  h+='<p class="hi-note">Kaynak: Vikipedi · Türkçe\'ye çevrilmiştir · Yakın tarihten uzağa</p>';
  el.innerHTML=h;
}

function renderFolk(){
  var el=ge("folk-content"),evts=getActiveEvents();
  if(!evts.length){ el.innerHTML='<p class="empty">Bu dönemde aktif takvim olayı yok.</p>'; return; }
  function badgeClr(st){return st==="act"?"#c0392b":st==="soon"?"#e67e22":"#555";}
  function badgeTxt(ev){
    if(ev.st==="act")return ev.ev.tp==="p"?(ev.de===0?"Bugün bitiyor":ev.de+" gün daha"):"Bugün!";
    if(ev.st==="soon")return ev.ds+" gün sonra";
    return Math.abs(ev.de)+" gün önce bitti";
  }
  var h="";
  for(var i=0;i<evts.length;i++){
    var ev=evts[i],e=ev.ev;
    var dateStr;
    if(ev.ev.tp==="p")dateStr=fmtDM(ev.start)+" – "+fmtDM(ev.end);
    else dateStr=fmtDMY(ev.start);
    h+='<div class="ev'+(ev.st==="act"?" hot":"")+'"><div class="ev-head" data-eid="'+e.id+'">';
    h+='<span class="ev-em">'+e.em+'</span>';
    h+='<div class="ev-info"><strong class="ev-name">'+esc(e.nm)+'</strong>';
    h+='<span class="ev-date">'+dateStr+'</span><span class="ev-short">'+esc(e.sh)+'</span></div>';
    h+='<span class="ev-badge" style="background:'+badgeClr(ev.st)+'">'+badgeTxt(ev)+'</span>';
    h+='<span class="ev-arr" id="arr-'+e.id+'">▼</span></div>';
    h+='<div class="ev-detail" id="det-'+e.id+'"><p class="ev-text">'+esc(e.fl)+'</p></div></div>';
  }
  el.innerHTML=h;
  el.onclick=function(ev2){
    var hd=ev2.target.closest(".ev-head");
    if(!hd)return;
    var id=hd.getAttribute("data-eid");
    var det=ge("det-"+id),arr=ge("arr-"+id);
    if(det&&arr){var o=det.classList.toggle("open");arr.innerHTML=o?"▲":"▼";}
  };
}

var notifActive = localStorage.getItem("no_notif") === "1";
function applyNotifUI(){
  var btn=ge("btn-notif"),lbl=ge("notif-lbl");
  if(!btn||!lbl)return;
  if(notifActive){btn.classList.add("on");lbl.textContent="Aktif ✓";}
  else{btn.classList.remove("on");lbl.textContent="Bildirimler";}
}
function toggleNotif(){
  notifActive=!notifActive;
  localStorage.setItem("no_notif",notifActive?"1":"0");
  applyNotifUI();
  if(notifActive){
    toast("🔔 Bildirimler açık!");
    if(typeof Notification!=="undefined"&&Notification.permission==="default"){
      try{Notification.requestPermission();}catch(e){}
    }
  }else toast("🔕 Bildirimler kapatıldı.");
}
function sendNotif(title,body){
  if(!notifActive)return;
  toast("🔔 "+title);
  try{if(typeof Notification!=="undefined"&&Notification.permission==="granted")new Notification(title,{body:body||""});}catch(x){}
}
var seenBreaking=[];
function checkBreaking(items){
  (items||[]).forEach(function(item){
    var id=(item.pub||"")+(item.title||"").slice(0,20);
    if(isBreaking(item.title)&&seenBreaking.indexOf(id)<0){
      seenBreaking.push(id);if(seenBreaking.length>100)seenBreaking.shift();
      sendNotif("🔴 SON DAKİKA: "+item.title,item.source);
    }
  });
}

var toastTmr=null;
function toast(msg){
  var el=ge("toast");el.textContent=msg;el.classList.add("on");
  clearTimeout(toastTmr);toastTmr=setTimeout(function(){el.classList.remove("on");},5000);
}

function switchTab(id){
  ["tr","wo","al"].forEach(function(t){
    var p=ge("p-"+t);if(p)p.style.display=t===id?"block":"none";
  });
  document.querySelectorAll(".tab").forEach(function(b){
    b.classList.toggle("on",b.getAttribute("data-tab")===id);
  });
}
function toggleAcc(bodyId,chvId){
  var body=ge(bodyId),chv=ge(chvId);if(!body||!chv)return;
  var open=body.classList.toggle("open");chv.innerHTML=open?"▲":"▼";
}
function tickClock(){var el=ge("clk");if(el)el.textContent=new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});}
setInterval(tickClock,1000);tickClock();
function setUpd(){var el=ge("upd-t");if(el)el.textContent=new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});}

function doRefresh(){
  toast("🔄 Güncelleniyor...");
  cDel("tr");cDel("wo");
  window.NEO_DEBUG = [];
  var d=new Date();cDel("hist_tr_"+(d.getMonth()+1)+"_"+d.getDate());
  ["list-tr","list-wo","list-al"].forEach(function(id){var el=ge(id);if(el)el.innerHTML=makeSkel();});
  ["stale-tr","stale-wo"].forEach(function(id){var el=ge(id);if(el)el.innerHTML="";});
  var hc=ge("hist-content");if(hc)hc.innerHTML=makeSkel(3);
  ["tr","wo","al"].forEach(function(t){setSp(t,true);});
  var noteEl=ge("note-wo");
  if(noteEl){ noteEl.textContent="🌐 Başlıklar ve özetler Türkçe'ye çevriliyor..."; noteEl.classList.remove("tr-active"); }
  Promise.all([loadTR(),loadWO(),loadHistory()]).then(function(res){
    var tr=res[0],wo=res[1],hist=res[2];
    renderNews(tr.data,"list-tr","cnt-tr","stale-tr");
    renderNews(wo.data,"list-wo","cnt-wo","stale-wo");
    var all=(tr.data||[]).concat(wo.data||[]).sort(function(a,b){return new Date(b.pub)-new Date(a.pub);}).slice(0,30);
    renderNews(all,"list-al","cnt-al",null);
    var an=ge("note-al");if(an)an.style.display=(wo.data||[]).length>0?"block":"none";
    renderHistory(hist);
    ["tr","wo","al"].forEach(function(t){setSp(t,false);});setUpd();
    var tl=(tr.data||[]).length,wl=(wo.data||[]).length;
    setStatus(tl+" TR + "+wl+" Dünya");
    checkBreaking((tr.data||[]).concat(wo.data||[]));
  });
}

document.addEventListener("DOMContentLoaded",function(){
  document.querySelectorAll(".tab").forEach(function(btn){
    btn.addEventListener("click",function(){switchTab(this.getAttribute("data-tab"));});
  });
  var ah=ge("acc-hist");if(ah)ah.addEventListener("click",function(){toggleAcc("body-hist","hist-chv");});

  var bn=ge("btn-notif");if(bn)bn.addEventListener("click",toggleNotif);

  ["tr","wo","al"].forEach(function(t){setSp(t,true);});
  setStatus("Yükleniyor...");

  Promise.all([loadTR(),loadWO(),loadHistory()]).then(function(res){
    var tr=res[0],wo=res[1],hist=res[2];
    renderNews(tr.data,"list-tr","cnt-tr","stale-tr");
    renderNews(wo.data,"list-wo","cnt-wo","stale-wo");
    var all=(tr.data||[]).concat(wo.data||[]).sort(function(a,b){return new Date(b.pub)-new Date(a.pub);}).slice(0,30);
    renderNews(all,"list-al","cnt-al",null);
    var an=ge("note-al");if(an)an.style.display=(wo.data||[]).length>0?"block":"none";
    renderHistory(hist);
    ["tr","wo","al"].forEach(function(t){setSp(t,false);});setUpd();
    var tl=(tr.data||[]).length,wl=(wo.data||[]).length;
    setStatus(tl+" TR + "+wl+" Dünya"+(tr.stale||wo.stale?" (önbellek)":""));
    checkBreaking((tr.data||[]).concat(wo.data||[]));

    setInterval(function(){
      cDel("tr");cDel("wo");
      window.NEO_DEBUG = [];
      Promise.all([loadTR(),loadWO()]).then(function(r2){
        var t2=r2[0],w2=r2[1];
        renderNews(t2.data,"list-tr","cnt-tr","stale-tr");
        renderNews(w2.data,"list-wo","cnt-wo","stale-wo");
        var a=(t2.data||[]).concat(w2.data||[]).sort(function(a,b){return new Date(b.pub)-new Date(a.pub);}).slice(0,30);
        renderNews(a,"list-al","cnt-al",null);
        setUpd();
        var tl2=(t2.data||[]).length,wl2=(w2.data||[]).length;
        setStatus(tl2+" TR + "+wl2+" Dünya");
        checkBreaking((t2.data||[]).concat(w2.data||[]));
      });
    },3600000);
  });
});
